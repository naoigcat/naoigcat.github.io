[tasks.serve]
description = "Run Jekyll in Docker (GitHub Pages dependency image)"
interactive = true
run = "swift scripts/serve.swift"

[tasks.lint]
description = "Lint Markdown files with markdownlint-cli2 (Docker)"
run = "swift scripts/lint.swift"

[tasks.tags]
description = "Regenerate per-tag JSON under assets/tags/ (Docker Jekyll export)"
run = "swift scripts/generate-tags-json.swift"

[tasks.test]
description = "Run repository regression tests"
run = "swift tests/run.swift"
