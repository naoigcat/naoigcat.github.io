name: Sync repository dependency images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches:
      - main
      - dependabot/**
    paths:
      - .github/workflows/lint.yml

permissions:
  contents: write

concurrency:
  group: sync-repository-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.actor == 'dependabot[bot]'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0.3"

      - name: Bump ProjectConfig.githubPagesImage from Docker Hub
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: swift scripts/swift-run.swift scripts/sync.swift scripts/support.swift github-pages-image

      - name: Resolve markdownlint-cli2-action ref from lint workflow
        if: github.event_name == 'push'
        id: action_ref
        run: swift scripts/swift-run.swift scripts/sync.swift scripts/support.swift markdownlint resolve-ref

      - name: Fetch markdownlint-cli2 version from action package.json
        if: github.event_name == 'push'
        id: cli2
        env:
          ACTION_REF: ${{ steps.action_ref.outputs.ref }}
        run: swift scripts/swift-run.swift scripts/sync.swift scripts/support.swift markdownlint fetch-version

      - name: Update Swift config
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.cli2.outputs.version }}
        run: swift scripts/swift-run.swift scripts/sync.swift scripts/support.swift markdownlint update

      - name: Commit GitHub Pages image if changed
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: swift scripts/swift-run.swift scripts/commit-and-push.swift scripts/support.swift --github-pages-image

      - name: Commit markdownlint image if changed
        if: github.event_name == 'push'
        env:
          COMMIT_PATH: scripts/config.swift
          COMMIT_MESSAGE: Sync ProjectConfig.markdownlintCLI2Image with markdownlint-cli2-action (${{ steps.cli2.outputs.version }})
        run: swift scripts/swift-run.swift scripts/commit-and-push.swift scripts/support.swift
