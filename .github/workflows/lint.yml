name: Lint markdown files

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'

  tags-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag JSON is up to date
        run: |
          set -euo pipefail
          bash scripts/generate-tags-json.sh
          # git diff ignores untracked files; intent-to-add makes new tag JSON visible.
          git add --intent-to-add assets/tags/
          if ! git diff --exit-code -- assets/tags/; then
            echo "::error::assets/tags/ is out of date. Run: mise run tags"
            git diff --stat -- assets/tags/
            exit 1
          fi
